<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grade Average</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #e0f7fa; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 900px;
      border: 2px solid #0288d1; 
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 36px;
      color: #0288d1;
    }

    .subject-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .subject {
      margin-bottom: 20px;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px 15px;
      border: 1px solid #0288d1;
      font-size: 16px;
      background-color: #f1f8e9; 
    }

    .form-control:focus {
      border-color: #0288d1;
      box-shadow: 0 0 0 0.2rem rgba(2, 136, 209, 0.25);
      background-color: #ffffff; 
    }

    .btn-primary {
      background-color: #0288d1;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #01579b; 
    }

    .btn-primary:active {
      background-color: #01579b;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .col-md-4 {
      flex: 1;
      min-width: 240px;
      text-align: center;
    }

    .alert {
      font-size: 18px;
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .alert-success {
      color: #fff;
      background-color: #388e3c; 
      border-color: #388e3c;
    }

    .alert-warning {
      color: #fff;
      background-color: #fbc02d; 
      border-color: #fbc02d;
    }

    .alert-danger {
      color: #fff;
      background-color: #d32f2f; 
      border-color: #d32f2f;
    }

    @media (max-width: 768px) {
      .row {
        flex-direction: column;
      }
    }

  </style>
</head>
<body>

<div class="box">
  <h1>Enter Your Grades</h1>

  <div class="row">
    
   
    <div class="col-md-4 subject">
      <img src="https://unescoalfozanprize.org/wp-content/uploads/2023/01/1_L76A5gL6176UbMgn7q4Ybg.jpeg" alt="Math" class="subject-img" />
      <label for="math" class="text-primary">Math Grade:</label>
      <input type="text" id="math" class="form-control" placeholder="Enter Math Grade" />
    </div>

   
    <div class="col-md-4 subject">
      <img src="https://img.freepik.com/free-vector/colorful-science-objects-icons-vector-set_1308-140707.jpg?semt=ais_hybrid&w=740" alt="Science" class="subject-img" />
      <label for="science" class="text-success">Science Grade:</label>
      <input type="text" id="science" class="form-control" placeholder="Enter Science Grade" />
    </div>

  
    <div class="col-md-4 subject">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQnskGBNHBOcTi0-dUkjwtMIMHRRSPsac_VQ&s" alt="Social Studies" class="subject-img" />
      <label for="social" class="text-danger">Social Studies Grade:</label>
      <input type="text" id="social" class="form-control" placeholder="Enter Social Studies Grade" />
    </div>

  </div>

  <div class="text-center mt-4">
    <button type="button" class="btn btn-primary" onclick="calculateAverage()">Calculate Average</button>
  </div>

 
  <div id="result" class="alert d-none"></div>
</div>

<script>
  function calculateAverage() {
    var math = document.getElementById("math").value;
    var science = document.getElementById("science").value;
    var social = document.getElementById("social").value;

    
    if (math === "" || science === "" || social === "") {
      alert("Please fill in all fields.");
      return;
    }

    var m = Number(math);
    var s = Number(science);
    var so = Number(social);
    var average = (m + s + so) / 3;

   
    let resultMessage;
    
    switch (true) {
      case (average >= 94 && average <= 100):
        resultMessage = "Excellent";
        alert(resultMessage); 
        break;
      case (average >= 87 && average < 94):
        resultMessage = "Above Satisfactory";
        alert(resultMessage); 
        break;
      case (average >= 80 && average < 87):
        resultMessage = "Satisfactory";
        alert(resultMessage); 
        break;
      case (average >= 75 && average < 80):
        resultMessage = "Needs Improvement";
        alert(resultMessage); 
        break;
      case (average >= 70 && average < 75):
        resultMessage = "Poor";
        alert(resultMessage); 
        break;
      default:
        resultMessage = "Failed";
        alert(resultMessage); 
        break;
    }
  }
</script>

</body>
</html>
